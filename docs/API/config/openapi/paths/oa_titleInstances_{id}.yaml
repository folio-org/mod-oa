parameters:
  - $ref: ../common/parameters/x-okapi-tenant.yaml
  - $ref: ../components/parameters/titleInstanceId.yaml
get:
  tags:
    - Title instances
  summary: Get a specified title instance record
  operationId: getTitleInstance
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TitleInstance.yaml
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '404':
      description: Not found error
      content:
        application/json:
          schema:
            $ref: ../common/schemas/HttpError.yaml
    '500':
      description: Internal server error
put:
  tags:
    - Title instances
  summary: Update title instance record
  operationId: putTitleInstance
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/TitleInstance.yaml
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TitleInstance.yaml
    '400':
      description: Bad request error
    '404':
      description: Not found error
      content:
        application/json:
          schema:
            $ref: ../common/schemas/HttpError.yaml
    '500':
      description: Internal server error
delete:
  tags:
    - Title instances
  summary: Delete a specified title instance record
  operationId: deleteTitleInstance
  responses:
    '204':
      description: No content
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '404':
      description: Not found error
      content:
        application/json:
          schema:
            $ref: ../common/schemas/HttpError.yaml
    '500':
      description: Internal server error
