get:
  tags:
    - Works
  summary: Get a set of work records.
  operationId: getWorks
  parameters:
    $ref: ../common/parameters/queryParameters.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/WorkResults.yaml
              - $ref: ../components/schemas/WorkResultsArray.yaml
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '500':
      description: Internal server error
