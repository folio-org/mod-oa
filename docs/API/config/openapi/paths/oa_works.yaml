description: Supports search and creation of works.
parameters:
  - $ref: ../common/parameters/x-okapi-tenant.yaml
get:
  tags:
    - Works
  summary: Get a set of work records.
  operationId: getWorks
  parameters:
    $ref: ../common/parameters/queryParameters.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/WorkResults.yaml
              - $ref: ../components/schemas/WorkResultsArray.yaml
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '500':
      description: Internal server error
post:
  tags:
    - Works
  summary: Create work record
  operationId: postWork
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Work.yaml
    required: true
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Work.yaml
    '400':
      description: Bad request error
    '403':
      description: Forbidden
    '500':
      description: Internal server error
