description: >-
  Exports a CSV report of book processing charges (BPC) for the given
  filters. Streams the CSV body directly to the response - there is no
  pagination, and the server does not set a `Content-Type` header on the
  response (only `Content-Disposition: attachment; filename=export.csv`).
parameters:
  - $ref: ../common/parameters/x-okapi-tenant.yaml
get:
  tags:
    - Reports
  summary: Get a book processing charges CSV report
  operationId: getOpenApcBpcReport
  parameters:
    - in: query
      name: institution
      description: >-
        Not used to filter the underlying query - included verbatim as the
        `institution` column value on every output row.
      schema:
        type: string
    - in: query
      name: paymentPeriod
      schema:
        type: string
    - in: query
      name: chargeCategory
      description: Comma-separated list of Charge category refdata values.
      schema:
        type: string
    - in: query
      name: chargeStatus
      description: Comma-separated list of Charge status refdata values.
      schema:
        type: string
  responses:
    '200':
      description: >-
        OK. CSV body with columns: institution, period, euro, doi,
        backlist_oa, book_title, isbn. Invalid paymentPeriod
        or other failures in the query result in a CSV with header but 
        no rows, or missing whatever rows the failure prevented
      content:
        text/csv:
          schema:
            type: string
    '400':
      description: Bad request error
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
