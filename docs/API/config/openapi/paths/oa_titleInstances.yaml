    - Title instances
  summary: Get a set of title instance records.
  operationId: getTitleInstances
  parameters:
    $ref: ../common/parameters/queryParameters.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/TitleInstanceResults.yaml
              - $ref: ../components/schemas/TitleInstanceResultsArray.yaml
    '400':
      description: Bad request error
    '401':
      description: Unauthorized
    '403':
