type: object
required:
  - title
  - instances
properties:
  title:
    type: string
  type:
    type: string
    description: >-
      e.g. `serial` or `monograph`. Used as the default `type` for each
      instance in `instances` that does not set its own.
  indexedInDOAJ:
    type: string
    description: >-
      Refdata value for the `Global.Yes_No` category, e.g. `Yes`/`No`. Used
      as the default for each instance's Work that does not set its own.
  oaStatus:
    type: string
    description: >-
      Refdata value for the Work's oaStatus category, e.g. `Gold`/`Hybrid`.
      Used as the default for each instance's Work that does not set its own.
  instances:
    type: array
    minItems: 1
    items:
      $ref: ./WorkCitationInstance.yaml
