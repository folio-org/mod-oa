            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
        '500':
          description: Internal server error
    delete:
      tags:
        - Reference data
      summary: Delete a specified reference data category record. Categories marked internal cannot be deleted and will return a 405.
      operationId: deleteRefdataCategory
      responses:
        '204':
          description: No content
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
        '405':
          description: Method not allowed - this reference data category is internal and cannot be deleted
        '500':
          description: Internal server error
  /oa/refdata/{domain}/{property}:
    description: Look up the reference data values for a single property of a domain class, e.g. the valid `requestStatus` values for `PublicationRequest`. The domain and property are combined into a reference data category name internally. An unrecognised `domain` returns a 404; an unrecognised `property` on a valid `domain` does not error, it returns a 200 with an empty result set, since a category name is always derived even when nothing matches it.
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/refdataDomain'
      - $ref: '#/components/parameters/refdataProperty'
    get:
      tags:
        - Reference data
      summary: Get the reference data values for a domain class property.
      operationId: getRefdataValuesForProperty
      parameters:
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/match'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/stats'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefdataResults'
                  - $ref: '#/components/schemas/RefdataResultsArray'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '404':
          description: 'Not found error: `domain` does not match any known domain class. Note an unrecognised `property` on a valid `domain` does not trigger this; it returns 200 with an empty result set instead. This action does not write its own error body, so the response is the servlet container''s default error page rather than this API''s usual `HttpError` shape.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
        '500':
          description: Internal server error
