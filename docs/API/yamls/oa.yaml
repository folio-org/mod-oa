          schema:
            type: string
        - in: query
          name: paymentPeriod
          schema:
            type: string
        - in: query
          name: chargeCategory
          description: Comma-separated list of Charge category refdata values.
          schema:
            type: string
        - in: query
          name: chargeStatus
          description: Comma-separated list of Charge status refdata values.
          schema:
            type: string
      responses:
        '200':
          description: 'OK. CSV body with columns: institution, period, euro, doi, backlist_oa, book_title, isbn. Invalid paymentPeriod or other failures in the query result in a CSV with header but  no rows, or missing whatever rows the failure prevented'
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: Bad request error
        '403':
          description: Forbidden
  /oa/reports/openApcTransformativeAgreementReport:
    description: 'Exports a CSV report of publication requests billed under a specific transformative agreement. Streams the CSV body directly to the response - there is no pagination, and the server does not set a `Content-Type` header on the response (only `Content-Disposition: attachment; filename=export.csv`).'
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
    get:
