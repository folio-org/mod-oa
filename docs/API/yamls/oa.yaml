        - $ref: '#/components/parameters/match'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/stats'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefdataCategoryResults'
                  - $ref: '#/components/schemas/RefdataCategoryResultsArray'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    post:
      tags:
        - Reference data
      summary: Create reference data category record
      operationId: postRefdataCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefdataCategory'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefdataCategory'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /oa/refdata/{id}:
    parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/refdataCategoryId'
    get:
      tags:
        - Reference data
      summary: Get a specified reference data category record
      operationId: getRefdataCategory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefdataCategory'
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpringBootErrorResponse'
        '500':
          description: Internal server error
    put:
      tags:
        - Reference data
      summary: Update reference data category record
      operationId: putRefdataCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefdataCategory'
