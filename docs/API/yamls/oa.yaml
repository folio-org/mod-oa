        - in: query
          name: paymentPeriod
          schema:
            type: string
        - in: query
          name: publicationStatus
          description: PublicationStatus refdata value to filter on.
          schema:
            type: string
        - in: query
          name: agreementId
          description: Remote ID of the agreement to report on.
          schema:
            type: string
      responses:
        '200':
          description: 'OK. CSV body with columns: institution, period, doi, is_hybrid, publisher, journal_full_title, issn, url. Invalid paymentPeriod or other failures in the query result in a CSV with header but  no rows, or missing whatever rows the failure prevented'
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: Bad request error
        '403':
          description: Forbidden
components:
  securitySchemes:
    okapiToken:
      type: apiKey
      in: header
      name: x-okapi-token
    accessToken:
      type: apiKey
      in: cookie
      name: folioAccessToken
  parameters:
    x-okapi-tenant:
      in: header
      name: x-okapi-tenant
      required: true
      schema:
        type: string
    filters:
      in: query
      name: filters
      required: false
      schema:
        type: string
    match:
      in: query
      name: match
      required: false
      schema:
        type: string
    term:
      in: query
      name: term
      required: false
      schema:
        type: string
    sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
    stats:
      in: query
      name: stats
      required: false
      schema:
        type: boolean
    perPage:
      in: query
      name: perPage
      required: false
      schema:
        type: integer
    offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
    page:
      in: query
      name: page
      required: false
      schema:
        type: integer
    refdataCategoryId:
      in: path
      name: id
      description: UUID for a reference data category
      required: true
      schema:
        type: string
        format: uuid
    refdataDomain:
      in: path
      name: domain
      description: Simple (case-insensitive) name of the domain class that owns the property, e.g. `PublicationRequest`
      required: true
      schema:
        type: string
    refdataProperty:
      in: path
      name: property
      description: Name of the refdata-backed property on the domain class, e.g. `requestStatus`
      required: true
      schema:
        type: string
    appSettingId:
      in: path
      name: id
      description: Identifier for an application setting
      required: true
      schema:
        type: string
    publicationRequestId:
      in: path
      name: publicationRequestId
      description: UUID for a publication request
      required: true
      schema:
        type: string
        format: uuid
    titleInstanceId:
      in: path
      name: id
      description: UUID for a title instance
      required: true
      schema:
        type: string
        format: uuid
    workId:
      in: path
      name: id
      description: UUID for a work
      required: true
      schema:
        type: string
        format: uuid
    partyId:
      in: path
      name: id
      description: UUID for a party
      required: true
      schema:
        type: string
        format: uuid
    correspondenceId:
      in: path
      name: id
      description: UUID for a correspondence record
      required: true
      schema:
        type: string
        format: uuid
    chargeId:
      in: path
      name: id
      description: UUID for a charge
      required: true
      schema:
        type: string
        format: uuid
    checklistItemDefinitionId:
      in: path
      name: id
      description: UUID for a checklist item definition
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ResultsMeta:
      type: object
      properties:
        meta:
          type: object
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        totalRecords:
          type: integer
    Refdata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        value:
          type: string
    RefdataCategory:
      type: object
      properties:
        desc:
          type: string
        id:
          type: string
          format: uuid
        internal:
          type: boolean
        values:
          type: array
          items:
            $ref: '#/components/schemas/Refdata'
    RefdataCategoryResultsArray:
      type: array
      items:
        $ref: '#/components/schemas/RefdataCategory'
    RefdataCategoryResults:
      type: object
      required:
        - results
      allOf:
        - $ref: '#/components/schemas/ResultsMeta'
        - type: object
        - properties:
            results:
              $ref: '#/components/schemas/RefdataCategoryResultsArray'
    SpringBootErrorResponse:
      type: object
      description: Spring Boot's default error body. Emitted by the servlet container itself when a request ends in an error status with no response body written by the application, rather than by this app's own error handling - so it does not match the `HttpError` shape used elsewhere in this API.
      properties:
        timestamp:
          type: integer
          description: Epoch milliseconds
        status:
          type: integer
        error:
          type: string
        path:
          type: string
    RefdataResultsArray:
      type: array
      items:
        $ref: '#/components/schemas/Refdata'
    RefdataResults:
      type: object
      required:
        - results
      allOf:
        - $ref: '#/components/schemas/ResultsMeta'
        - type: object
        - properties:
            results:
              $ref: '#/components/schemas/RefdataResultsArray'
    AppSetting:
      type: object
      required:
        - id
        - key
      properties:
        id:
          type: string
          readOnly: true
        section:
          type: string
        key:
          type: string
        settingType:
          type: string
        vocab:
          type: string
        defValue:
          type: string
        value:
          type: string
        hidden:
          type: boolean
          description: If true, this setting is excluded from filter/search results but is otherwise still retrievable and modifiable normally.
    AppSettingResultsArray:
      type: array
      items:
        $ref: '#/components/schemas/AppSetting'
    AppSettingResults:
      type: object
      required:
        - results
      allOf:
        - $ref: '#/components/schemas/ResultsMeta'
        - type: object
        - properties:
            results:
              $ref: '#/components/schemas/AppSettingResultsArray'
    Address:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        addressLineOne:
          type: string
        addressLineTwo:
          type: string
        city:
          type: string
        region:
          type: string
        postalCode:
          type: string
        country:
          type: string
    PartyAddress:
      type: object
      required:
        - id
        - address
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
          description: The party that this address belongs to
        address:
          $ref: '#/components/schemas/Address'
    AlternateEmailAddress:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
          description: The party that this alternate email address belongs to
        email:
          type: string
          format: email
    Party:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        familyName:
          type: string
        givenNames:
          type: string
        fullName:
          type: string
          readOnly: true
          description: Derived automatically from givenNames and familyName
        orcidId:
          type: string
        mainEmail:
          type: string
          format: email
        phone:
          type: string
        mobile:
          type: string
        streetAddress:
          $ref: '#/components/schemas/PartyAddress'
        institutionLevel1:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        institutionLevel2:
          type: string
        alternateEmails:
          type: array
          items:
            $ref: '#/components/schemas/AlternateEmailAddress'
    RequestParty:
      type: object
      required:
        - id
        - role
        - partyOwner
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          description: The role this party plays on the request, e.g. corresponding author
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        partyOwner:
          $ref: '#/components/schemas/Party'
    Identifier:
      type: object
      required:
        - value
        - ns
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Present when reached via /oa/publicationRequest; absent via /oa/titleInstances
        value:
          type: string
        ns:
          type: object
          required:
            - value
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Present when reached via /oa/publicationRequest; absent via /oa/titleInstances
            value:
              type: string
    IdentifierOccurrence:
      type: object
      required:
        - identifier
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Present when reached via /oa/publicationRequest; absent via /oa/titleInstances
        identifier:
          $ref: '#/components/schemas/Identifier'
        title:
          type: object
          readOnly: true
          description: Present when reached via /oa/titleInstances; absent via /oa/publicationRequest
          properties:
            id:
              type: string
              format: uuid
        status:
          description: Present when reached via /oa/titleInstances; absent via /oa/publicationRequest
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        selected:
          type: boolean
          description: Present when reached via /oa/titleInstances; absent via /oa/publicationRequest
    TitleInstance:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        work:
          type: string
          format: uuid
          writeOnly: true
        publicationType:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        type:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        subType:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierOccurrence'
    Work:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        indexedInDOAJ:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        oaStatus:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/TitleInstance'
    RemoteOkapiLink:
      type: object
      required:
        - id
        - remoteId
      properties:
        id:
          type: string
          readOnly: true
        remoteId:
          type: string
          format: uuid
        remoteId_object:
          readOnly: true
          description: Result of a live lookup against the remote system by remoteId. Either the resolved remote object (shape depends on what is being linked to) or, if the lookup failed, an error object.
          oneOf:
            - type: object
            - type: object
              properties:
                error:
                  oneOf:
                    - type: integer
                    - type: string
                  description: HTTP status code if the lookup failed with an HTTP error, otherwise the exception class name.
                message:
                  type: string
    PublicationRequestAgreement:
      allOf:
        - $ref: '#/components/schemas/RemoteOkapiLink'
        - type: object
          required:
            - owner
          properties:
            owner:
              type: string
              format: uuid
              readOnly: true
    ExternalRequestId:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
        externalId:
          type: string
          description: An identifier for this request in an external system
    PublicationRequestHistory:
      type: object
      required:
        - id
        - toState
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
        lastUpdated:
          type: string
          format: date-time
          readOnly: true
        note:
          type: string
        fromState:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        toState:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
    PublicationIdentifier:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
        type:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Refdata'
        publicationIdentifier:
          type: string
    PublicationStatus:
      type: object
